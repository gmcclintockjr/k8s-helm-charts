name: Deploy Helm Chart

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install Helm
      uses: azure/setup-helm@v3
      with:
        version: v3.12.0

    - name: Lint Helm Chart
      run: helm lint ./myapp

    - name: Template Helm Chart
      run: helm template myapp-release ./myapp

    - name: Success!!
      run: echo "Helm chart validated successfully!!"
